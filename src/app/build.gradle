plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

def rawBuildVersion = findProperty('Project_Build_Version')?.toString()?.trim()
def projectBuildVersion = (rawBuildVersion && rawBuildVersion ==~ /^\d+(\.\d+)+$/ && !rawBuildVersion.contains('%'))
        ? rawBuildVersion
        : '1.0.0'
def versionParts = projectBuildVersion.tokenize('.')
def projectVersionCode = 1
if (versionParts.size() >= 4) {
    projectVersionCode = versionParts[0].toInteger() * 1000000 + versionParts[1].toInteger() * 10000 +
            versionParts[2].toInteger() * 100 + versionParts[3].toInteger()
} else if (versionParts.size() == 3) {
    projectVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()
}

android {
    namespace 'com.irtek.live'
    compileSdk 36

    defaultConfig {
        applicationId "com.irtek.live"
        minSdk 24
        targetSdk 36
        versionCode projectVersionCode
        versionName projectBuildVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        output.outputFileName = "FotricLive-${variant.versionName}-${variant.name}.apk"
    }
}

dependencies {
    implementation "com.irtek:netsdk:${findProperty('IRTEK_NETSDK_VERSION')}"

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.kotlinx.coroutines.android
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation "androidx.compose.material:material-icons-extended"

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}
